<!doctype html><!-- v3 --><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E4D64"><meta name="description" content="Mappa dei clienti per agenti di commercio"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="InZona"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon.svg"><title>InZona</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
:root{padding:env(safe-area-inset-top) 0 0}
:root{
 --paper:#F3F6F5;--surface:#FFFFFF;--surface-2:#E9EFEE;--ink:#13222C;--muted:#5A6A72;--line:#D5DEDC;
 --brand:#0E4D64;--brand-ink:#FFFFFF;--signal:#F5A524;--pin-ink:#13222C;
 --ok:#1F8A5B;--warn:#C98204;--crit:#C2410C;--never:#7B8A92;
 --map-land:#EEF1EC;--map-water:#A9CFE0;--map-grid:#E2E7E1;--map-road:#C8793A;--map-town:#2E3E48;--map-town-2:#5F6E76;
 --shadow:0 10px 30px rgba(15,35,45,.16),0 2px 6px rgba(15,35,45,.08);
 --r:14px;--nav-h:64px;
 font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --paper:#0E151A;--surface:#16212A;--surface-2:#1E2B35;--ink:#E6EEF0;--muted:#94A4AC;--line:#2A3944;
 --brand:#4FB0CC;--brand-ink:#0B1A21;--signal:#F7B84B;--pin-ink:#13222C;
 --ok:#3DBB82;--warn:#E6A93A;--crit:#F07C4A;--never:#8796A0;
 --map-land:#1A242C;--map-water:#23475A;--map-grid:#202C35;--map-road:#9B6A3F;--map-town:#D5E0E4;--map-town-2:#9AAAB2;
 --shadow:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);}}
:root[data-theme="dark"]{
 --paper:#0E151A;--surface:#16212A;--surface-2:#1E2B35;--ink:#E6EEF0;--muted:#94A4AC;--line:#2A3944;
 --brand:#4FB0CC;--brand-ink:#0B1A21;--signal:#F7B84B;--pin-ink:#13222C;
 --ok:#3DBB82;--warn:#E6A93A;--crit:#F07C4A;--never:#8796A0;
 --map-land:#1A242C;--map-water:#23475A;--map-grid:#202C35;--map-road:#9B6A3F;--map-town:#D5E0E4;--map-town-2:#9AAAB2;
 --shadow:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--signal);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{position:relative;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);max-width:560px;margin:0 auto;background:var(--paper);overflow:hidden}
@media (min-width:700px){#app{border-inline:1px solid var(--line)}}
/* barra superiore */
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);z-index:5}
.top>*{min-width:0}
.brand{display:flex;align-items:center;gap:8px;flex:none}
.brand svg{width:34px;height:34px}
.word{font-weight:500;font-size:21px;letter-spacing:-.02em;font-stretch:88%}
.word b{font-weight:800;color:var(--brand)}
.proj{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:4px 10px;text-align:left}
.proj small{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.proj span{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}
.iconbtn.primary{background:var(--signal);border-color:var(--signal);color:var(--pin-ink)}
/* area centrale */
.stage{position:relative;overflow:hidden}
#map{position:absolute;inset:0;display:block}
.float{position:absolute;right:12px;display:flex;flex-direction:column;gap:8px;z-index:3}
.float .iconbtn{box-shadow:var(--shadow);border-color:transparent}
.banner{position:absolute;left:12px;right:66px;top:12px;z-index:3;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--ink);color:var(--surface);box-shadow:var(--shadow);font-size:14px}
.banner b{color:var(--signal)}
.banner button{margin-left:auto;border:0;border-radius:9px;padding:7px 11px;background:var(--signal);color:var(--pin-ink);font-weight:700;flex:none}
.attrib{position:absolute;left:8px;bottom:6px;font-size:10.5px;color:var(--muted);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:2px 6px;border-radius:6px;z-index:2}
.legend{position:absolute;left:12px;bottom:28px;z-index:2;display:flex;gap:10px;background:var(--surface);border-radius:10px;padding:6px 10px;font-size:11.5px;color:var(--muted);box-shadow:var(--shadow)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
/* pannelli a tutto schermo */
.panel{position:absolute;inset:0;background:var(--paper);overflow:auto;z-index:4;padding:16px 16px 28px}
.panel h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;font-stretch:92%;text-wrap:balance}
.panel .sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.item .t{font-weight:700;font-size:15.5px;min-width:0;line-height:1.25}
.item .m{grid-column:1;color:var(--muted);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .r{grid-row:1/span 2;grid-column:2;text-align:right;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.dist{font-weight:800;font-size:17px;color:var(--ink);font-stretch:90%}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.p-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.p-never{color:var(--never);background:color-mix(in srgb,var(--never) 15%,transparent)}
.p-q{color:var(--crit);background:color-mix(in srgb,var(--crit) 12%,transparent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-weight:700;display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.signal{background:var(--signal);border-color:var(--signal);color:var(--pin-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit)}
.btn.block{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.section h3{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
/* navigazione inferiore */
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
.nav svg{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--brand)}
.nav button[aria-current="page"]::after{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--crit);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
/* scheda cliente (bottom sheet) */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);max-height:78%;overflow:auto;padding:8px 16px 18px;transform:translateY(0);transition:transform .22s ease}
.sheet.closed{transform:translateY(105%)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 10px}
.card-h{display:flex;gap:10px;align-items:flex-start}
.card-h h3{margin:0;font-size:21px;line-height:1.15;font-weight:800;letter-spacing:-.015em;font-stretch:92%;text-wrap:balance}
.card-h .x{margin-left:auto}
.meta{color:var(--muted);font-size:13.5px;margin-top:3px}
.kv{display:grid;grid-template-columns:92px 1fr auto;gap:10px 10px;align-items:center;margin:14px 0;font-size:14.5px}
.kv dt{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv .acts{display:flex;gap:6px}
.mini{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:var(--brand);text-decoration:none}
.mini svg{width:19px;height:19px}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cta .wide{grid-column:1/-1}
.note{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13.5px;color:var(--muted)}
/* modale */
.scrim{position:absolute;inset:0;background:rgba(8,18,24,.45);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);width:100%;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.modal h3{margin:0 0 6px;font-size:20px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.modal p{margin:0 0 12px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.field input,.field select,.field textarea{padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);width:100%}
.field textarea{min-height:70px;resize:vertical}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.table{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.table table{border-collapse:collapse;font-size:12.5px;min-width:100%}
.table td,.table th{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
.table th{background:var(--surface-2)}
.progress{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);width:0;transition:width .2s}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch input{appearance:none;width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{left:23px}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;z-index:20;box-shadow:var(--shadow);max-width:calc(100% - 32px);font-size:14px}
.day{font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 2px 2px}
.demo{font-size:12px;color:var(--warn);font-weight:700}
.nearbar{position:absolute;left:12px;right:12px;bottom:28px;z-index:4;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px 12px;border:1px solid var(--line)}
.nearbar .nh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.nearbar .nh b{flex:1;min-width:0;font-size:14.5px;line-height:1.25}
.nearbar .nh .gps{width:9px;height:9px;border-radius:50%;background:#2f7cf6;box-shadow:0 0 0 4px #2f7cf62e;flex:none}
.nearbar .rad{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-weight:700;font-size:12.5px;color:var(--ink)}
.nearbar .cl{width:30px;height:30px;border:0;background:none;display:grid;place-items:center;color:var(--muted);padding:0}
.nearbar .cl svg,.nearbar .nc svg{width:18px;height:18px}
.nearbar .row2{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}
.nearbar .row2::-webkit-scrollbar{display:none}
.nearbar .nc{flex:0 0 auto;min-width:140px;max-width:190px;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 10px;display:grid;gap:1px}
.nearbar .nc .t{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nearbar .nc .m{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nearbar .nc .d{font-weight:800;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:6px}
.nearbar .nc .d i{width:8px;height:8px;border-radius:50%;display:inline-block}
.nearbar .nc.all{place-items:center;min-width:92px;font-weight:700;color:var(--brand);font-size:13px}
.nearbar .msg{font-size:13.5px;color:var(--muted);margin:0 0 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>

  <div class="scrim" id="scrim" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast" hidden></div>
 </main>
 <nav class="nav" id="nav"></nav>
 <input type="file" id="fileIn" hidden accept=".xlsx,.xls,.ods,.csv,.txt,.docx,.vcf">
 <input type="file" id="backupIn" hidden accept=".json">
</div>

const TS=256, D2R=Math.PI/180;
const W=z=>TS*Math.pow(2,z);
const lon2x=(lon,z)=>(lon+180)/360*W(z);
const lat2y=(lat,z)=>{const s=Math.sin(lat*D2R);return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*W(z)};
const x2lon=(x,z)=>x/W(z)*360-180;
const y2lat=(y,z)=>{const n=Math.PI-2*Math.PI*y/W(z);return Math.atan(Math.sinh(n))/D2R};
function haversine(a,b){const R=6371,dLa=(b.lat-a.lat)*D2R,dLo=(b.lon-a.lon)*D2R;const s=Math.sin(dLa/2)**2+Math.cos(a.lat*D2R)*Math.cos(b.lat*D2R)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(s))}

/* ---------- visite e registrazione viaggi ---------- */
function addVisit(c,kind='manuale'){S.visits.push({id:uid(),pid:P().id,cid:c.id,name:c.azienda,t:Date.now(),kind});save();refreshMarkers()}
let watchId=null,gpsState='off',autoNear=true,nearAt=null,firstFix=true;
function startTrip(){startGPS()}
function startGPS(){if(watchId!=null)return;if(!navigator.geolocation){gpsState='none';renderNearBar();return}gpsState='wait';renderNearBar();
 watchId=navigator.geolocation.watchPosition(pos=>{gpsState='ok';S.me={lat:pos.coords.latitude,lon:pos.coords.longitude,acc:pos.coords.accuracy,t:Date.now()};map.me=S.me;
  if(firstFix){firstFix=false;save();applyAutoNear(true)}else if(!nearAt||haversine(nearAt,S.me)>0.3){save();applyAutoNear(false)}else{map.redraw();renderNearBar()}
  if(view==='near'&&near.origin==='me')renderNear();
  if(!S.settings.trip)return;const today=new Date().toDateString();allClients().filter(hasPos).forEach(c=>{if(haversine(S.me,c)<0.15){const done=S.visits.some(v=>v.cid===c.id&&new Date(v.t).toDateString()===today);if(!done){addVisit(c,'auto');toast('Visita registrata: '+c.azienda)}}})},
  err=>{if(err&&err.code===1){gpsState='denied';navigator.geolocation.clearWatch(watchId);watchId=null}else if(gpsState!=='ok')gpsState='err';renderNearBar()},
  {enableHighAccuracy:true,maximumAge:20000,timeout:20000})}
function nearMe(){if(!S.me)return[];return allClients().filter(hasPos).map(c=>({c,d:haversine(S.me,c)})).sort((a,b)=>a.d-b.d)}
function applyAutoNear(fly){if(!S.me)return;nearAt={lat:S.me.lat,lon:S.me.lon};
 if(autoNear&&view==='map'&&!pickFor){const all=nearMe(),res=all.filter(x=>x.d<=near.radius);near.ids=new Set(res.map(x=>x.c.id));map.circle={lat:S.me.lat,lon:S.me.lon,km:near.radius};refreshMarkers();
  if(fly&&!openId){if(res.length)map.fit([S.me,...res.slice(0,15).map(x=>x.c)],70,14);else map.flyTo(S.me.lat,S.me.lon,Math.max(10,Math.min(13,13-Math.log2(near.radius/5))))}}
 else{map.redraw()}
 renderNearBar()}
function renderNearBar(){const el=$('#nearbar');if(!el)return;const show=autoNear&&view==='map'&&!openId&&!pickFor&&!verifyQ.length&&gpsState!=='off';el.hidden=!show;$('#legend').hidden=show;if(!show)return;
 const head=(t,extra='')=>`<div class="nh"><span class="gps"></span><b>${t}</b>${extra}<button class="cl" data-act="nearBarClose" aria-label="Nascondi">${IC.x}</button></div>`;
 if(gpsState==='wait'&&!S.me){el.innerHTML=head('Cerco la tua posizione…')+`<p class="msg">Consenti a InZona di usare la posizione per vedere i clienti vicini.</p>`;return}
 if(gpsState==='denied'||gpsState==='none'||(!S.me&&gpsState==='err')){el.innerHTML=head('Posizione non disponibile')+`<p class="msg">${gpsState==='denied'?'Hai negato l’accesso alla posizione. Attivalo nelle impostazioni del telefono (App › InZona › Autorizzazioni › Posizione).':'Accendi il GPS del telefono e riprova.'}</p><button class="btn primary block" data-act="gpsRetry">${IC.locate} Riprova</button>`;return}
 const all=nearMe(),res=all.filter(x=>x.d<=near.radius);const rad=`<button class="rad num" data-act="nearRad" aria-label="Cambia raggio">${near.radius} km ▾</button>`;
 if(!all.length){el.innerHTML=head('Nessun cliente sulla mappa',rad)+`<p class="msg">Carica un elenco da “Elenchi”: i clienti compariranno qui in ordine di distanza.</p>`;return}
 const card=({c,d})=>`<button class="nc" data-act="openFromList" data-id="${c.id}"><span class="d num"><i style="background:${colorFor(c)}"></i>${fmtKm(d)}</span><span class="t">${esc(c.azienda)}</span><span class="m">${esc(c.comune||c.referente||'')}</span></button>`;
 if(!res.length){el.innerHTML=head(`Nessun cliente entro ${near.radius} km`,rad)+`<div class="row2">${card(all[0])}<button class="nc all" data-act="nearWiden">Allarga<br>il raggio</button></div>`;return}
 el.innerHTML=head(`${res.length} ${res.length===1?'cliente':'clienti'} vicino a te`,rad)+`<div class="row2">${res.slice(0,8).map(card).join('')}<button class="nc all" data-act="nearAll">Vedi tutti<br>›</button></div>`}
function askTrip(){ $('#modal').dataset.lock='1';openModal(`<div class="brand" style="margin-bottom:10px">${$('.brand svg').outerHTML}<span class="word">in<b>Zona</b></span></div><h3>Vuoi che registri i tuoi viaggi?</h3><p>Quando ti fermi presso un cliente, InZona annota la visita nella cronologia. Così sai sempre quando l’hai visto l’ultima volta. La posizione resta solo su questo telefono.</p>

function nearOrigin(){if(near.origin==='me')return S.me?{...S.me,label:'la tua posizione'}:null;const c=findClient(near.origin);return c&&hasPos(c)?{lat:c.lat,lon:c.lon,label:c.azienda,id:c.id}:null}
function nearList(){const o=nearOrigin();if(!o)return[];return allClients().filter(c=>hasPos(c)&&c.id!==o.id).map(c=>({c,d:haversine(o,c)})).filter(x=>x.d<=near.radius).sort((a,b)=>a.d-b.d)}
function renderNear(){const el=$('#view-near');const o=nearOrigin();const res=nearList();
 const opts=allClients().filter(hasPos).sort((a,b)=>a.azienda.localeCompare(b.azienda,'it')).map(c=>`<option value="${c.id}" ${near.origin===c.id?'selected':''}>${esc(c.azienda)} – ${esc(c.comune||'')}</option>`).join('');

 <div class="chips">${[5,10,20,30,50].map(k=>`<button class="chip num" data-act="radius" data-v="${k}" aria-pressed="${near.radius===k}">${k} km</button>`).join('')}</div>

 <div class="row" style="justify-content:space-between"><b class="num">${res.length} ${res.length===1?'cliente':'clienti'} entro ${near.radius} km da ${esc(o.label)}</b></div>
 <div class="grid2"><button class="btn" data-act="nearOnMap">${IC.map} Vedi sulla mappa</button><button class="btn signal" data-act="tour" ${res.length?'':'disabled'}>${IC.route} Proponi giro</button></div>

 <p class="sub" style="font-size:12.5px">Distanze in linea d’aria. Il giro proposto parte dal più vicino e segue il cliente successivo più prossimo (max 9 tappe).</p>`}</div>`}

function tour(){const o=nearOrigin();let rest=nearList().map(x=>x.c);const seq=[];let cur=o;while(rest.length&&seq.length<9){rest.sort((a,b)=>haversine(cur,a)-haversine(cur,b));cur=rest.shift();seq.push(cur)}

 const dest=seq[seq.length-1],wps=seq.slice(0,-1).map(c=>c.lat+','+c.lon).join('|');const url=`https://www.google.com/maps/dir/?api=1&origin=${o.lat},${o.lon}&destination=${dest.lat},${dest.lon}${wps?'&waypoints='+encodeURIComponent(wps):''}&travelmode=driving`;

const LIBS={XLSX:['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'],mammoth:['https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js','https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js'],docx:['https://cdn.jsdelivr.net/npm/docx@9.6.1/dist/index.iife.js']};
function script(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>{s.remove();ko(new Error(src))};document.head.appendChild(s)})}
async function lib(name){if(window[name])return window[name];for(const u of LIBS[name]){try{await script(u);if(window[name])return window[name]}catch(e){}}throw new Error('Serve una connessione a internet per leggere/creare questo tipo di file.')}

/* ---------- lettura dei file ---------- */
function parseCSV(txt){txt=txt.replace(/^﻿/,'');const first=txt.split(/\r?\n/)[0]||'';const cnt=d=>first.split(d).length;const del=[';',',','\t','|'].sort((a,b)=>cnt(b)-cnt(a))[0];const rows=[];let row=[],f='',q=false;for(let i=0;i<txt.length;i++){const ch=txt[i];if(q){if(ch==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else if(ch==='"')q=true;else if(ch===del){row.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=ch}if(f||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>String(x).trim()))}
function parseVCF(txt){const out=[['Azienda','Referente','Cellulare','Telefono','E-mail','Indirizzo','CAP','Comune','Provincia']];txt.split(/END:VCARD/i).forEach(b=>{if(!/BEGIN:VCARD/i.test(b))return;const g=re=>{const m=b.match(re);return m?m[1].trim():''};const adr=g(/\nADR[^:]*:([^\n\r]*)/i).split(';');const cell=g(/\nTEL[^:]*CELL[^:]*:([^\n\r]*)/i),tel=g(/\nTEL[^:]*:([^\n\r]*)/i);out.push([g(/\nORG[^:]*:([^\n\r;]*)/i)||g(/\nFN[^:]*:([^\n\r]*)/i),g(/\nFN[^:]*:([^\n\r]*)/i),cell||tel,cell&&tel!==cell?tel:'',g(/\nEMAIL[^:]*:([^\n\r]*)/i),adr[2]||'',adr[5]||'',adr[3]||'',adr[4]||''])});return out}
async function readFile(file){const ext=(file.name.split('.').pop()||'').toLowerCase();
 if(['csv','txt'].includes(ext))return{format:'csv',rows:parseCSV(await file.text())};
 if(ext==='vcf')return{format:'vcf',rows:parseVCF(await file.text())};
 if(['xlsx','xls','ods'].includes(ext)){const X=await lib('XLSX');const wb=X.read(await file.arrayBuffer(),{type:'array'});const sh=wb.SheetNames[0];return{format:'xlsx',sheet:sh,rows:X.utils.sheet_to_json(wb.Sheets[sh],{header:1,defval:'',raw:false})}}
 if(ext==='docx'){const M=await lib('mammoth');const r=await M.convertToHtml({arrayBuffer:await file.arrayBuffer()});const doc=new DOMParser().parseFromString(r.value,'text/html');const tb=[...doc.querySelectorAll('table')].sort((a,b)=>b.rows.length-a.rows.length)[0];if(tb)return{format:'docx',rows:[...tb.rows].map(tr=>[...tr.cells].map(td=>td.textContent.trim()))};const lines=[...doc.querySelectorAll('p')].map(p=>p.textContent.trim()).filter(Boolean);return{format:'docx',rows:parseCSV(lines.join('\n'))}}
 throw new Error('Formato .'+ext+' non supportato. Salva il file come Excel (.xlsx), CSV o Word (.docx) con una tabella.')}
const SYN={azienda:['ragione sociale','azienda','ditta','cliente','societa','denominazione','nome azienda','company','impresa','org'],referente:['referente','contatto','persona di riferimento','responsabile','titolare','nome e cognome','nominativo'],cellulare:['cellulare','cell','mobile','telefono cellulare','smartphone'],telefono:['telefono','tel','telefono fisso','fisso','phone'],email:['e mail','email','mail','posta elettronica','pec'],indirizzo:['indirizzo','via','sede','address','indirizzo sede'],cap:['cap','c a p','codice postale'],comune:['comune','citta','localita','paese','city','sede comune'],provincia:['provincia','prov','pr','sigla provincia'],note:['note','annotazioni','commenti','osservazioni']};
function guessMap(headers){const m={};const H=headers.map(h=>norm(h));FIELDS.forEach(([k])=>{let i=H.findIndex((h,j)=>SYN[k].includes(h)&&!Object.values(m).includes(headers[j]));if(i<0)i=H.findIndex((h,j)=>h&&SYN[k].some(s=>h.includes(s))&&!Object.values(m).includes(headers[j]));if(i>=0)m[k]=headers[i]});return m}
let imp=null;

async function doImport(){FIELDS.forEach(([k])=>{imp.map[k]=$('#map_'+k).value||undefined});if(!imp.map.azienda){toast('Scegli la colonna con il nome dell’azienda');return}

let netOK=true,netFail=0,lastReq=0,geoBusy=false;
const short=d=>String(d||'').split(',').slice(0,4).join(',');
async function getJSON(url,ms=10000){const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms);try{const r=await fetch(url,{signal:ctl.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
const TOWN=['city','town','village','hamlet','municipality','administrative','county','state','suburb','locality','postcode'];
async function nomi(q){if(navigator.onLine===false){netOK=false;return[]}
 // 1) Nominatim (OpenStreetMap) – max una richiesta al secondo
 const wait=1100-(Date.now()-lastReq);if(wait>0)await new Promise(r=>setTimeout(r,wait));lastReq=Date.now();
 try{const j=await getJSON('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=it&limit=3&accept-language=it&q='+encodeURIComponent(q));netOK=true;netFail=0;if(j.length)return j.map(r=>({lat:+r.lat,lon:+r.lon,label:short(r.display_name),town:TOWN.includes(r.type)||r.category==='boundary'||r.category==='place'}))}catch(e){netFail++}
 // 2) Photon (komoot) come riserva, se Nominatim non risponde o non trova nulla
 try{const j=await getJSON('https://photon.komoot.io/api/?limit=4&lat=45.5&lon=10.0&q='+encodeURIComponent(q));netOK=true;netFail=0;return (j.features||[]).filter(f=>(f.properties.countrycode||'').toUpperCase()==='IT').slice(0,3).map(f=>{const p=f.properties;return{lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0],label:[p.name,[p.street,p.housenumber].filter(Boolean).join(' '),[p.postcode,p.city||p.county].filter(Boolean).join(' ')].filter(Boolean).join(', '),town:TOWN.includes(p.type)||p.osm_key==='place'||p.osm_key==='boundary'}})}
 catch(e){netFail++;if(netFail>=6)netOK=false;return[]}}
async function geocode(c){const cands=[];const add=(arr,how,k)=>arr.slice(0,2).forEach(r=>{if(!cands.some(x=>x.k===k&&haversine(x,r)<0.03))cands.push({lat:r.lat,lon:r.lon,label:r.label,how,k})});
 const place=[c.cap,c.comune,c.provincia].filter(Boolean).join(' ');
 if(c.indirizzo){const r=(await nomi([c.indirizzo,place].filter(Boolean).join(', '))).filter(x=>!x.town);add(r,'Trovata dall’indirizzo','addr');
  if(!r.length&&place){const via=c.indirizzo.replace(/[\s,]+(n\.?|nr\.?|civ\.?)?\s*\d+\s*[a-z]?(\/\s*\w+)?\s*$/i,'').trim();if(via&&via!==c.indirizzo)add((await nomi(via+', '+place)).filter(x=>!x.town),'Trovata dalla via (senza numero civico)','addr')}}
 if(c.azienda&&!cands.some(x=>x.k==='addr')){const r=(await nomi([c.azienda,c.comune||c.provincia].filter(Boolean).join(', '))).filter(x=>!x.town);add(r,'Trovata cercando il nome dell’azienda','name')}
 let g=gazFind(c.comune);if(!g&&!c.comune&&c.indirizzo){const a=' '+norm(c.indirizzo)+' ';const h=GAZ.filter(x=>a.includes(' '+norm(x[0])+' ')).sort((x,y)=>y[0].length-x[0].length)[0];if(h)g={name:h[0],prov:h[1],lat:h[2],lon:h[3]}}let town=g?{lat:g.lat,lon:g.lon,label:'Centro di '+g.name+' ('+g.prov+')'}:null;
 if(!town&&(c.comune||c.cap)&&netOK){const t=(await nomi([c.cap,c.comune,c.provincia,'Italia'].filter(Boolean).join(', ')))[0];if(t)town={lat:t.lat,lon:t.lon,label:t.label}}
 if(town)cands.push({...town,how:'Posizione approssimativa sul comune',k:'town'});
 let status='missing';const a=cands.find(x=>x.k==='addr'),n=cands.find(x=>x.k==='name');
 if(a&&(!n||haversine(a,n)<0.4))status='ok';else if(a||n)status='confirm';else if(town)status='approx';
 const best=cands[0];if(best){c.lat=best.lat;c.lon=best.lon}else{delete c.lat;delete c.lon}c.geo={status,label:best?best.label:'',how:best?best.how:'',cands,ci:0}}
let wakeLock=null;
async function keepAwake(on){try{if(on){if(!wakeLock&&'wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}else if(wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&geoBusy)keepAwake(true)});
async function geocodeAll(list,title){if(!list.length)return;geoBusy=true;keepAwake(true);netOK=true;netFail=0;$('#modal').dataset.lock='1';
 openModal(`<h3>${esc(title)}</h3><p id="geoMsg">0 di ${list.length}</p><div class="progress"><i id="geoBar"></i></div><p style="margin-top:10px;font-size:12.5px">Uso l’indirizzo e il nome dell’azienda. Se non sono sicuro, alla fine ti chiedo conferma.</p><p style="margin-top:6px;font-size:12.5px"><b>Lo schermo resta acceso finché non ho finito.</b> Se chiudi l’app, alla prossima apertura riprendo da dove ero rimasto.</p>`);
 for(let i=0;i<list.length;i++){await geocode(list[i]);if(i%5===4)save();const m=$('#geoMsg');if(m){m.textContent=`${i+1} di ${list.length} · ${list[i].azienda}`;$('#geoBar').style.width=((i+1)/list.length*100)+'%'}if(!netOK&&!hasPos(list[i])&&i>=2&&list.slice(0,i+1).every(c=>!hasPos(c)))break}
 geoBusy=false;keepAwake(false);save();delete $('#modal').dataset.lock;renderTop();refreshMarkers()}
async function retryGeo(){const p=P();const todo=p.clients.filter(c=>!hasPos(c));if(!todo.length)return;if(navigator.onLine===false){toast('Serve internet per cercare gli indirizzi');return}

function projectTable(p){const base=(p.file.headers||[]).slice();const map=p.map||{};const headers=base.length?base:FIELDS.map(f=>f[1]);const byField={};FIELDS.forEach(([k,l])=>{const h=map[k]||(base.length?null:l);if(h)byField[h]=k});
 FIELDS.forEach(([k,l])=>{if(!map[k]&&base.length&&p.clients.some(c=>c[k])){headers.push(l);byField[l]=k}});
 ['Ultima visita','Latitudine','Longitudine'].forEach(h=>{if(!headers.includes(h))headers.push(h)});
 const rows=p.clients.map(c=>headers.map(h=>{if(byField[h])return c[byField[h]]||'';if(h==='Ultima visita'){const t=lastVisit(c.id);return t?fmtDate(t):''}if(/^(lat|latitudine)$/i.test(norm(h)))return hasPos(c)?+c.lat.toFixed(6):'';if(/^(lon|lng|longitudine)$/i.test(norm(h)))return hasPos(c)?+c.lon.toFixed(6):'';return c.extra?.[h]??''}));return{headers,rows}}

 listF:d=>{listQ.f=d.v;renderList()}, listSort:()=>{listQ.sort=listQ.sort==='az'?'dist':'az';if(listQ.sort==='dist'&&!S.me)locate(false);renderList()},
 radius:d=>{near.radius=+d.v;S.settings.radius=near.radius;save();renderNear()},
 nearOnMap:()=>{autoNear=false;const o=nearOrigin();const res=nearList();near.ids=new Set(res.map(x=>x.c.id));if(o.id)near.ids.add(o.id);map.circle={lat:o.lat,lon:o.lon,km:near.radius};setView('map');refreshMarkers();map.fit([o,...res.map(x=>x.c)],50,14);toast(res.length+' clienti entro '+near.radius+' km')},
 tour, locate:()=>locate(true),
 fitAll:()=>{autoNear=false;renderNearBar();near.ids=null;map.circle=null;refreshMarkers();map.fit(allClients().filter(hasPos))},
 delVisit:d=>{S.visits=S.visits.filter(v=>v.id!==d.id);save();renderHistory();refreshMarkers()},
 trip:d=>{S.settings.trip=d.v==='1';save();delete $('#modal').dataset.lock;closeModal();startGPS();if(S.settings.trip)toast('Registrazione viaggi attiva')},
 verifyAll:()=>startVerify(), verifyOne:d=>startVerify([d.id]),
 vYes:d=>{const c=findClient(d.id);c.geo.status='ok';save();verifyQ.shift();refreshMarkers();toast('Posizione confermata');nextVerify()},
 vNext:d=>{const c=findClient(d.id),g=c.geo;g.ci=((g.ci||0)+1)%g.cands.length;const k=g.cands[g.ci];c.lat=k.lat;c.lon=k.lon;g.label=k.label;g.how=k.how;save();refreshMarkers();nextVerify()},
 vPick:d=>{pickFor=d.id;closeSheet();map.pick=true;renderBanner();renderNearBar();map.redraw()},
 vSkip:()=>{verifyQ.shift();nextVerify()},
 cancelPick:()=>{pickFor=null;map.pick=false;renderBanner();map.redraw();if(verifyQ.length)nextVerify()},
 projects:()=>openModal(`<h3>Elenchi clienti</h3><div class="stack">${S.projects.map(p=>`<button class="item" data-act="useProj" data-id="${p.id}"><span class="t">${esc(p.name)}</span><span class="m num">${esc(p.file.name)} · ${p.clients.length} clienti</span><span class="r">${p.id===S.active?'<span class="pill p-ok">In uso</span>':''}</span></button>`).join('')}<button class="btn primary block" data-act="import">${IC.up} Carica un nuovo elenco</button></div>`),
 useProj:d=>{S.active=d.id;save();closeModal();near.ids=null;map.circle=null;closeSheet();renderTop();refreshMarkers();map.fit(allClients().filter(hasPos));if(view==='more')renderMore()},
 newProj:async()=>{const n=await ask('Nome del nuovo elenco',{ok:'Crea elenco',input:'I miei clienti'});if(!n||!n.trim())return;const p=emptyProject(n.trim());S.projects.push(p);S.active=p.id;save();closeModal();renderTop();refreshMarkers();if(view==='more')renderMore();toast('Elenco “'+p.name+'” creato: aggiungi i clienti con +')},
 import:()=>{closeModal();$('#fileIn').value='';$('#fileIn').click()},
 doImport, exportProj:d=>exportProj(d.id,d.fmt),
 renameProj:async d=>{const p=S.projects.find(x=>x.id===d.id);const n=await ask('Nuovo nome dell’elenco',{ok:'Salva',input:p.name});if(n&&n.trim()){p.name=n.trim();save();renderMore();renderTop()}},
 delProj:async d=>{const p=S.projects.find(x=>x.id===d.id);if(!await ask('Eliminare l’elenco “'+p.name+'” e la sua cronologia?',{ok:'Sì, elimina',danger:true}))return;S.projects=S.projects.filter(x=>x.id!==d.id);S.visits=S.visits.filter(v=>v.pid!==d.id);if(!S.projects.length)S.projects.push(emptyProject());if(!S.projects.find(x=>x.id===S.active))S.active=S.projects[0].id;save();renderMore();renderTop();refreshMarkers()},
 backup:()=>saveFile('InZona_backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(S,null,1)),
 restore:()=>{$('#backupIn').value='';$('#backupIn').click()},
 resetAll:async()=>{if(!await ask('Cancellare tutti i dati e ricaricare l’esempio?',{ok:'Sì, ricarica',danger:true}))return;const t=S.settings.trip;S=seed();S.settings.trip=t;save();renderTop();refreshMarkers();renderMore();map.fit(allClients().filter(hasPos))},
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a||!A[a.dataset.act])return;if(a.tagName!=='A')e.preventDefault();A[a.dataset.act](a.dataset,a)});
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(f)onFile(f)});
$('#backupIn').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.projects)throw 0;S=d;save();renderTop();refreshMarkers();renderMore();toast('Backup ripristinato')}catch(x){toast('Questo file non è un backup di InZona')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#scrim').hidden&&!$('#modal').dataset.lock)closeModal();else if(openId)closeSheet()}});

/* ---------- avvio ---------- */
S=load()||seed();near.radius=S.settings.radius||10;
map=new MapView($('#map'),{
 onMarker:m=>{if(pickFor)return;if(verifyQ.length&&verifyQ[0]!==m.id)verifyQ=[];openCard(m.id,true)},
 onTap:(ll)=>{if(pickFor){const c=findClient(pickFor);c.lat=ll.lat;c.lon=ll.lon;c.geo={status:'manual',label:'Indicata a mano'};pickFor=null;map.pick=false;save();refreshMarkers();renderNearBar();toast('Posizione di '+c.azienda+' salvata');if(verifyQ[0]===c.id)verifyQ.shift();if(verifyQ.length)nextVerify();else openCard(c.id,false);return}if(openId&&!verifyQ.length)closeSheet()},
 onStatus:s=>{$('#attrib').innerHTML=s==='tiles'?'© OpenStreetMap':'Mappa schematica (offline) · con internet vedi le strade'}
});
map.readColors();renderTop();setView('map');refreshMarkers();
map.fit(allClients().filter(hasPos),40,11);
setTimeout(()=>{if(map.tileMode==='try'&&!map.tileOk)$('#attrib').textContent='Mappa schematica (offline) · con internet vedi le strade'},4000);
if(S.settings.trip===null)setTimeout(askTrip,500);else startGPS();
setTimeout(()=>{if(geoBusy||navigator.onLine===false||!P())return;const todo=P().clients.filter(c=>!hasPos(c)&&!c.geo);if(todo.length)geocodeAll(todo,'Riprendo a mettere i clienti sulla mappa…').then(()=>{map.fit(P().clients.filter(hasPos));toast('Clienti sulla mappa aggiornati')});else renderBanner()},1500);
if('serviceWorker' in navigator&&location.protocol==='https:'&&!window.claude)navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
</body></html>
